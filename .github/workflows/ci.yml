name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size

      - name: Upload coverage artifact
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  publish-dry-run:
    name: npm pack --dry-run
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - name: Pack
        run: npm pack --dry-run
      - name: Ensure CLAUDE.md is NOT in the publish payload
        run: |
          npm pack --dry-run --json > pack.json
          if grep -q '"CLAUDE.md"' pack.json; then
            echo "CLAUDE.md must never be published." >&2
            exit 1
          fi
